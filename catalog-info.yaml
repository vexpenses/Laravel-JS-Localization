# Descritor do catálogo de software (Backstage). Este arquivo é do time.
# Padrão: Confluence > Squad SRE > "Padrão catalog-info.yaml (Backstage)".
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: laravel-js-localization
  title: "Laravel JS Localization (fork)"
  description: "Fork da biblioteca que converte as mensagens do Laravel para uso no front-end"
  tags:
    - php
    - laravel
  annotations:
    github.com/project-slug: vexpenses/Laravel-JS-Localization
    vexpenses.com/tier: "3"
    vexpenses.com/tribe: cross  # viagens, pagamentos, despesas ou cross
    vexpenses.com/compliance: none  # lgpd, pci, pii, kyc-kyb separados por vírgula, ou none
  links:
    - type: docs
      title: README
      url: https://github.com/vexpenses/Laravel-JS-Localization#readme
    - type: chat
      title: ~squad-sre-public
      url: https://eae.vexpens.es/dev/channels/squad-sre-public
spec:
  type: library  # service, website, library, lambda, terraform-project, terraform-module ou script
  lifecycle: production
  owner: group:default/engenharia
  system: system:default/vexpenses
